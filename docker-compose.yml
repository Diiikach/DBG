services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DGV_HTTP_ADDR: ":8080"
      DGV_DB_DSN: "postgres://user:users_pswd@postgres:5432/DGV_BD?sslmode=disable"
      DGV_STORAGE_DIR: "/data"
      DGV_REFERENCE_FASTA: "/data/reference.fa"
      DGV_PIPELINE_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_PROXY_TARGET: "http://api:8080"
    volumes:
      - ./web:/app
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:14.8-alpine3.18
    environment:
      POSTGRES_DB: "DGV_BD"
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "users_pswd"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - ./db_init:/docker-entrypoint-initdb.d
      - dgvdb-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d DGV_BD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G

volumes:
  dgvdb-data:
